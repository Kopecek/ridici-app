<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drivebook – nastavení klíčů</title><style>body{font:17px system-ui;max-width:800px;margin:30px auto;padding:20px;background:#112238;color:white}button{padding:15px;background:#d9f36b;border:0;border-radius:9px;font-size:18px}input,textarea{display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0 22px}textarea{height:90px;word-break:break-all}label{font-weight:bold}</style><h1>Vytvoření klíčů pro Drivebook</h1><p>Klíče se vytvoří pouze v tomto prohlížeči. Tato stránka je nikam neodesílá. Zkopíruj je do Vercel → Settings → Environment Variables. Soukromý klíč ani aktivační kód veřejně nesdílej.</p><p>Pokud už push funguje, klíče neměň: změna vyžaduje nové přihlášení zařízení.</p><label>Kontaktní e-mail vlastníka</label><input id="email" type="email" placeholder="tvuj@email.cz"><button id="generate">Vytvořit klíče</button><div id="output"></div><script>
function base64url(b){return btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'')}
document.querySelector('#generate').onclick=async()=>{const email=document.querySelector('#email');if(!email.value||!email.checkValidity()){email.reportValidity();return}try{const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']),pub=await crypto.subtle.exportKey('raw',pair.publicKey),priv=await crypto.subtle.exportKey('jwk',pair.privateKey);const data={VAPID_PUBLIC_KEY:base64url(pub),VAPID_PRIVATE_KEY:priv.d,VAPID_SUBJECT:'mailto:'+email.value,CRON_SECRET:base64url(crypto.getRandomValues(new Uint8Array(32))),PUSH_SETUP_CODE:base64url(crypto.getRandomValues(new Uint8Array(24)))};const out=document.querySelector('#output');out.replaceChildren();for(const [key,value] of Object.entries(data)){const label=document.createElement('label'),area=document.createElement('textarea');label.textContent=key;area.value=value;area.readOnly=true;out.append(label,area)}const p=document.createElement('p');p.textContent='Dále přidej UPSTASH_REDIS_REST_URL a UPSTASH_REDIS_REST_TOKEN z databáze Upstash. Pak ve Vercelu spusť Redeploy.';out.append(p)}catch{alert('Klíče nelze vytvořit. Otevři stránku přes HTTPS v Safari nebo Chromu.')}};
</script></html>
